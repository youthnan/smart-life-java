server:
  port: 8088

hmdp:
  bloom:
    shop:
      enabled: true
      expected-insertions: 100000
      false-probability: 0.01
      # 可选：定时增量/全量回灌，降低长周期数据漂移风险
      refresh-enabled: false
      refresh-initial-delay-ms: 300000
      refresh-interval-ms: 3600000
  ratelimit:
    enabled: true
    trust-proxy: false
  kafka:
    cache-invalidation:
      # 多实例部署建议开启；单机可关闭
      enabled: false
      topic: hmdp.cache.shop.invalidate
      consumer-group: hmdp-shop-cache-invalidation
      double-delete-delay-ms: 300
  cache:
    logical-expire:
      # 物理 TTL = 逻辑 TTL + skew；确保逻辑过期策略下 key 不会过早被 Redis 清除
      physical-ttl-skew-seconds: 60
      cold-miss-initial-backoff-ms: 30
      cold-miss-max-backoff-ms: 320
    shop-local:
      maximum-size: 10000
      ttl-minutes: 10
  seckill:
    stream:
      consumer-count: 1
      read-batch-size: 1
      pending-error-alert-threshold: 10
  agent:
    dashscope:
      # 与 seckill-agent 对齐：优先 LLM_*；未设置时回退 DASHSCOPE_API_KEY（勿将密钥提交到仓库）
      api-key: ${LLM_API_KEY:${DASHSCOPE_API_KEY:}}
      base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${LLM_MODEL:qwen-turbo}
      memory-ttl-minutes: 30
      max-messages: 20
      # 默认关闭：多数「兼容 OpenAI」端点/模型不支持 tools，会报 Tools are currently not supported…；需要查店工具时设为 true
      tools-enabled: ${HMDP_AGENT_DASHSCOPE_TOOLS_ENABLED:false}

spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  redis:
    host: ${SPRING_REDIS_HOST:127.0.0.1}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: hmdp-shop-cache-invalidation
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${hmdp.kafka.cache-invalidation.enabled:false}
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
